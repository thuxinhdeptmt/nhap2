<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gachapon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1 class="brand-title">
        <span class="title-star" aria-hidden="true">✦</span>
        <span>Gachapon</span>
        <span class="title-star title-star-small" aria-hidden="true">✦</span>
      </h1>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-body">
          <section class="filter-card filter-card-search">
            <div class="field">
              <label for="itemName">Tên vật phẩm</label>

              <div class="search-wrapper">
                <span class="search-icon" aria-hidden="true">🔍</span>

                <input
                  id="itemName"
                  type="search"
                  placeholder="Nhập tên vật phẩm..."
                  autocomplete="off"
                >
              </div>
            </div>
          </section>

          <section class="filter-card filter-card-options">
            <div class="field">
              <label for="basicStat">Chỉ số cơ bản</label>

              <div class="select-wrapper">
                <span class="select-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M4 19V9"></path>
                    <path d="M10 19V5"></path>
                    <path d="M16 19v-7"></path>
                    <path d="M22 19V3"></path>
                  </svg>
                </span>

                <select id="basicStat"></select>
              </div>
            </div>

            <div class="field">
              <label for="upgrade">Số lần nâng cấp</label>

              <div class="select-wrapper">
                <span class="select-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="m8 12 4-4 4 4"></path>
                    <path d="M12 8v8"></path>
                  </svg>
                </span>

                <select id="upgrade"></select>
              </div>
            </div>

            <div class="field">
              <label for="category">Phân loại</label>

              <div class="select-wrapper">
                <span class="select-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                  </svg>
                </span>

                <select id="category"></select>
              </div>
            </div>

            <div class="field">
              <label for="job">Job</label>

              <div class="select-wrapper">
                <span class="select-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21a8 8 0 0 1 16 0"></path>
                  </svg>
                </span>

                <select id="job"></select>
              </div>
            </div>

            <div class="field">
              <label for="machine">Máy xổ số</label>

              <div class="select-wrapper">
                <span class="select-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                    <circle cx="8" cy="8" r="1"></circle>
                    <circle cx="16" cy="8" r="1"></circle>
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="8" cy="16" r="1"></circle>
                    <circle cx="16" cy="16" r="1"></circle>
                  </svg>
                </span>

                <select id="machine"></select>
              </div>
            </div>
          </section>

          <div class="sidebar-footer-card">
            <div class="actions">
              <button
                id="resetButton"
                class="action-button button-reset"
                type="button"
              >
                <span class="reset-symbol" aria-hidden="true">↻</span>
                <span>Reset</span>
              </button>
            </div>

            <section class="quick-filter">
              <h2 class="quick-filter-title">Tìm nhanh</h2>

              <div class="quick-group">
                <button
                  class="quick-chip"
                  type="button"
                  data-filter-type="stat"
                  data-filter-value="+ATT"
                >
                  +ATT
                </button>

                <button
                  class="quick-chip"
                  type="button"
                  data-filter-type="stat"
                  data-filter-value="+M.ATT"
                >
                  +M.ATT
                </button>

                <button
                  class="quick-chip quick-chip-name"
                  type="button"
                  data-filter-type="item-name"
                  data-filter-value="tấn công vật lý"
                >
                  Vật lý
                </button>

                <button
                  class="quick-chip quick-chip-name"
                  type="button"
                  data-filter-type="item-name"
                  data-filter-value="tấn công pháp thuật"
                >
                  Pháp thuật
                </button>
              </div>
            </section>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="content-header">
          <h2>Kết quả</h2>

          <div id="status" class="result-status">
            Đang tải dữ liệu...
          </div>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th class="column-number">
                    <div class="header-cell">STT</div>
                  </th>

                  <th class="column-name">
                    <div class="header-cell">Tên vật phẩm</div>
                  </th>

                  <th class="column-stats">
                    <div class="header-cell">Chỉ số cơ bản</div>
                  </th>

                  <th class="column-upgrade">
                    <div class="header-cell">Số lần nâng cấp</div>
                  </th>

                  <th class="column-requirement">
                    <div class="header-cell">Yêu cầu</div>
                  </th>

                  <th class="column-category">
                    <div class="header-cell">Phân loại</div>
                  </th>

                  <th class="column-job">
                    <div class="header-cell">Job</div>
                  </th>

                  <th class="column-machine">
                    <div class="header-cell">Máy xổ số</div>
                  </th>
                </tr>
              </thead>

              <tbody id="resultBody">
                <tr>
                  <td colspan="8" class="message">
                    Đang tải dữ liệu...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
